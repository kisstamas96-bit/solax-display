name: SolaX Display Update

on:
  schedule:
    # Minden 5. percben lefut
    - cron: '*/5 * * * *'
  workflow_dispatch: # Kézi indítási lehetőség

jobs:
  update-display:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run SolaX script
        env:
          SOLAX_TOKEN: ${{ secrets.SOLAX_TOKEN }}
          SOLAX_SN: ${{ secrets.SOLAX_SN }}
          GEEKMAGIC_IP: ${{ secrets.GEEKMAGIC_IP }}
        run: python solax.py
